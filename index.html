<html lang="en">
<head>

<title>TradeHisab LotCalc.pk - World's Simplest Trading Calculator</title>
<style>
:root{--bg:#09090b;--card:#141414;--border:#222;--green:#7fff7f;--muted:#888;--text:#eee}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.logo{font-weight:800;font-size:20px}.logo span{color:var(--green)}
.btn{background:var(--green);color:#000;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer}
.badge{display:inline-block;background:rgba(127,255,127,.15);color:var(--green);padding:5px 12px;border-radius:20px;font-size:11px;margin-bottom:12px;border:1px solid rgba(127,255,127,.3)}
.hero{text-align:center;padding:28px 16px}
.hero h1{font-size:28px;margin-bottom:8px}.hero p{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1000px;margin:0 auto;padding:0 16px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
select,input{width:100%;background:#0a0a0a;border:1px solid var(--border);color:#fff;padding:10px;border-radius:8px;outline:none}
select:focus,input:focus{border-color:var(--green)}
.result{border:1px solid rgba(124,255,124,.3);border-radius:10px;padding:12px;margin-top:12px;background:#0f0f0f}
.result h2{color:var(--green);font-size:13px;margin-bottom:4px}
#assetSearch{margin-bottom:6px}
#assetList{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px;display:none;background:#0a0a0a}
#assetList div{padding:8px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid #111}
#assetList div:hover{background:#1a1a1a;color:var(--green)}
#assetList b{color:var(--muted);font-size:10px;display:block}
.cat{color:var(--green);font-size:10px;font-weight:800;padding:6px 10px;background:#111;position:sticky;top:0}
footer{text-align:center;padding:24px;color:var(--muted);font-size:11px}
</style>
</head>
<body>
