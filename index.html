<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TradeHisab LotCalc.pk</title><style>:root{--bg:#09090b;--card:#141414;--border:#222;--green:#7fff7f;--muted:#888;--text:#eee}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:var(--text)}header{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)} .logo{font-weight:800;font-size:20px}.logo span{color:var(--green)}.btn{background:var(--green);color:#000;border:0;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer}.badge{display:inline-block;background:rgba(127,255,127,.15);color:var(--green);padding:5px 12px;border-radius:20px;font-size:11px;margin-bottom:12px;border:1px solid rgba(127,255,127,.3)}.hero{text-align:center;padding:28px 16px}.hero h1{font-size:26px}.hero p{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1000px;margin:0 auto;padding:0 16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}select,input{width:100%;background:#0a0a0a;border:1px solid var(--border);color:#fff;padding:10px;border-radius:8px;outline:none}.result{border:1px solid rgba(124,255,124,.3);border-radius:10px;padding:12px;margin-top:12px;background:#0f0f0f}.result h2{color:var(--green);font-size:12px}#assetSearch{margin-bottom:6px}#assetList{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px;display:none;background:#0a0a0a}#assetList div{padding:8px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid #111}#assetList div:hover{background:#1a1a1a;color:var(--green)}#assetList b{color:var(--muted);font-size:10px;display:block}.cat{color:var(--green);font-size:10px;font-weight:800;padding:6px 10px;background:#111;position:sticky;top:0}footer{text-align:center;padding:24px;color:var(--muted);font-size:11px}</style></head><body><header><div class="logo">📈 TradeHisab <span>LotCalc.pk</span></div><a href="#" class="btn" style="font-size:12px;text-decoration:none">Get Started</a></header><div class="hero"><span class="badge">Made for Global Traders • Free</span><h1>World's Simplest Trading Calculator</h1><p>Calculate margin, profit/loss, risk in seconds — 154 Exness instruments</p></div><div class="grid"><div class="card"><label>Select Asset (Searchable)</label><input id="assetSearch" placeholder="Type XAU OIL ETH JPY EUR..."><div id="assetList"></div><div id="assetInfo" style="font-size:11px;color:var(--muted);margin-top:6px"></div><label>Leverage</label><select id="lev"><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="500">500</option><option value="1000">1000</option><option value="2000" selected>2000 Exness</option><option value="9999">Unlimited</option></select><label>Balance USD</label><input id="bal" type="number" value="10000"><label>Lot</label><input id="lot" type="number" step="0.01" value="0.10"><label>Entry</label><input id="entry" type="number" step="0.00001" value="2600"><label>SL</label><input id="sl" type="number" step="0.00001" value="2590"><button class="btn" style="width:100%;margin-top:14px" onclick="calc()">Calculate</button></div><div><div class="card"><h3 style="font-size:14px;margin-bottom:10px">Results</h3><div class="result"><h2>Margin Required</h2><div id="m">$0</div><div id="mPKR" style="font-size:11px;color:var(--muted)">PKR 0</div></div><div class="result"><h2 style="color:#ff5a5a">Risk / Loss</h2><div id="pl">0 USD</div><div id="pips" style="font-size:11px">0</div></div><div class="result"><h2>Risk %</h2><div id="risk">0 USD</div><div id="riskP" style="font-size:11px">0%</div></div><button class="btn" style="width:100%;margin-top:12px;background:#25D366;color:#fff" onclick="shareWA()">Share on WhatsApp</button></div></div></div><footer>TradeHisab / LotCalc.pk — RATE 281.5 PKR</footer><script>const RATE=281.5;const INSTRUMENTS=[["Forex","EURUSD Euro Dollar 100000"],["Forex","GBPUSD Pound Dollar 100000"],["Forex","USDJPY Dollar Yen 100000"],["Forex","GBPJPY Pound Yen 100000"],["Forex","EURJPY Euro Yen 100000"],["Forex","AUDJPY Aussie Yen 100000"],["Forex","USDSEK Dollar SEK 100000"],["Forex","USDZAR Dollar Rand 100000"],["Forex","USDTRY Dollar Lira 100000"],["Forex","AUDUSD Aussie Dollar 100000"],["Forex","USDCHF Dollar Swiss 100000"],["Forex","NZDUSD Kiwi 100000"],["Forex","USDCAD Dollar CAD 100000"],["Forex","EURGBP Euro Pound 100000"],["Forex","EURCHF Euro Swiss 100000"],["Forex","EURAUD Euro Aussie 100000"],["Forex","EURCAD Euro CAD 100000"],["Forex","EURNZD Euro Kiwi 100000"],["Forex","GBPAUD Pound Aussie 100000"],["Forex","GBPCAD Pound CAD 100000"],["Forex","GBPCHF Pound Swiss 100000"],["Forex","GBPNZD Pound Kiwi 100000"],["Forex","AUDCAD Aussie CAD 100000"],["Forex","AUDCHF Aussie Swiss 100000"],["Forex","AUDNZD Aussie Kiwi 100000"],["Forex","CADCHF CAD Swiss 100000"],["Forex","CADJPY CAD Yen 100000"],["Forex","CHFJPY Swiss Yen 100000"],["Forex","EURSEK Euro SEK 100000"],["Forex","EURNOK Euro NOK 100000"],["Forex","EURTRY Euro Lira 100000"],["Forex","EURZAR Euro Rand 100000"],["Forex","GBPSEK Pound SEK 100000"],["Forex","GBPNOK Pound NOK 100000"],["Forex","NZDJPY Kiwi Yen 100000"],["Forex","NZDCAD Kiwi CAD 100000"],["Forex","NZDCHF Kiwi Swiss 100000"],["Forex","USDHKD Dollar HKD 100000"],["Forex","USDMXN Dollar MXN 100000"],["Forex","USDSGD Dollar SGD 100000"],["Forex","USDNOK Dollar NOK 100000"],["Forex","AUDSEK Aussie SEK 100000"],["Forex","EURHUF Euro HUF 100000"],["Forex","GBPPLN Pound PLN 100000"],["Metals","XAUUSD Gold 100"],["Metals","XAGUSD Silver 5000"],["Metals","XPTUSD Platinum 100"],["Metals","XPDUSD Palladium 100"],["Metals","XAUEUR Gold Euro 100"],["Metals","XAUGBP Gold GBP 100"],["Energies","USOIL WTI Crude 1000"],["Energies","UKOIL Brent Crude 1000"],["Energies","XNGUSD Natural Gas 10000"],["Crypto","BTCUSD Bitcoin 1"],["Crypto","ETHUSD Ethereum 1"],["Crypto","LTCUSD Litecoin 1"],["Crypto","XRPUSD Ripple 1"],["Crypto","SOLUSD Solana 1"],["Crypto","DOGEUSD Dogecoin 1"],["Crypto","BNBUSD Binance 1"],["Crypto","ADAUSD Cardano 1"],["Crypto","AVAXUSD Avalanche 1"],["Crypto","DOTUSD Polkadot 1"],["Crypto","LINKUSD Chainlink 1"],["Crypto","SHIBUSD Shiba 1"],["Indices","US30 Dow Jones 10"],["Indices","US500 S&P 500 10"],["Indices","USTEC Nasdaq 10"],["Indices","GER40 DAX 10"],["Indices","UK100 FTSE 10"],["Indices","FRA40 CAC 40 10"],["Indices","JP225 Nikkei 10"],["Indices","AUS200 ASX 10"],["Stocks","AAPL Apple 1"],["Stocks","TSLA Tesla 1"],["Stocks","NVDA Nvidia 1"],["Stocks","MSFT Microsoft 1"],["Stocks","AMZN Amazon 1"],["Stocks","GOOGL Google 1"],["Stocks","META Meta 1"],["Stocks","NFLX Netflix 1"]].map(a=>{let p=a[1].split(' ');let s=parseFloat(p.pop());return{cat:a[0],symbol:p[0],name:p.slice(1).join(' '),size:s}});const assetSearch=document.getElementById('assetSearch');const assetList=document.getElementById('assetList');const assetInfo=document.getElementById('assetInfo');let selected=null;function buildOptions(list){assetList.innerHTML='';let cur='';list.forEach(it=>{if(it.cat!==cur){cur=it.cat;let c=document.createElement('div');c.className='cat';c.textContent=cur;assetList.appendChild(c);}let d=document.createElement('div');d.innerHTML=`${it.symbol} <b>${it.name} • Contract ${it.size}</b>`;d.onclick=()=>selectAsset(it);assetList.appendChild(d);});}function selectAsset(it){selected=it;assetSearch.value=it.symbol+' - '+it.name;assetList.style.display='none';assetInfo.textContent=`Selected: ${it.symbol} | ${it.cat} | Contract ${it.size}`;calc();}assetSearch.addEventListener('input',()=>{let q=assetSearch.value.toUpperCase().trim();if(!q){assetList.style.display='none';return}let f=INSTRUMENTS.filter(i=>(i.symbol+' '+i.name+' '+i.cat).toUpperCase().includes(q));buildOptions(f.slice(0,80));assetList.style.display='block';});assetSearch.addEventListener('focus',()=>{buildOptions(INSTRUMENTS);assetList.style.display='block';});function calc(){if(!selected)selected=INSTRUMENTS.find(i=>i.symbol==='XAUUSD');let lot=parseFloat(document.getElementById('lot').value)||0;let entry=parseFloat(document.getElementById('entry').value)||0;let sl=parseFloat(document.getElementById('sl').value)||0;let bal=parseFloat(document.getElementById('bal').value)||0;let lev=parseFloat(document.getElementById('lev').value)||2000;let size=selected.size;let margin=(lot*size*entry)/lev;let diff=Math.abs(entry-sl);let loss=lot*size*diff;document.getElementById('m').innerText='$'+margin.toFixed(2);document.getElementById('mPKR').innerText='PKR '+(margin*RATE).toFixed(0);document.getElementById('pl').innerText=loss.toFixed(2)+' USD / '+(loss*RATE).toFixed(0)+' PKR';document.getElementById('pips').innerText=diff.toFixed(5)+' diff | Contract '+size;document.getElementById('risk').innerText=loss.toFixed(2)+' USD';document.getElementById('riskP').innerText=bal>0?(loss/bal*100).toFixed(2)+'% of balance':'0%';}function shareWA(){let t=`TradeHisab: Margin ${document.getElementById('m').innerText}, Risk ${document.getElementById('pl').innerText}`;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}buildOptions(INSTRUMENTS);selected=INSTRUMENTS.find(i=>i.symbol==='XAUUSD');assetSearch.value='XAUUSD - Gold';assetInfo.textContent='Selected: XAUUSD | Metals | Contract 100';calc();</script></body></html>
